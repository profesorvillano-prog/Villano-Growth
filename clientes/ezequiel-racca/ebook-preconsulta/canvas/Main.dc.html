<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Mulish:wght@400;500;600;700;800&display=swap');

    body { font-family: 'Mulish', system-ui, sans-serif; }
    a { color: #C2A05B; } a:hover { color: #d8bd85; }

<div style="width:794px;height:1123px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%, #4a3357 0%, #33243d 55%, #2a1d34 100%);color:#F3ECE0;">

  <div style="position:absolute;inset:32px;border:1px solid rgba(194,160,91,0.18);"></div>

  <div style="position:absolute;inset:0;padding:96px 88px;display:flex;flex-direction:column;align-items:center;text-align:center;">
    <!-- eyebrow -->
    <div style="font-size:12px;letter-spacing:5px;color:#C2A05B;font-weight:700;text-transform:uppercase;">Guía de bienvenida · Pre-consulta</div>

    <!-- motif -->
    <div style="margin-top:64px;">
      <svg width="118" height="118" viewBox="0 0 118 118" fill="none">
        <circle cx="59" cy="59" r="52" stroke="#C2A05B" stroke-width="1" opacity="0.5"/>

          <path d="M59 30c-13 0-16 12-8 17s16 5 16 15-11 12-19 8"/>

          <line x1="59" y1="10" x2="59" y2="2"/><line x1="93" y1="25" x2="99" y2="19"/>
          <line x1="108" y1="59" x2="116" y2="59"/><line x1="25" y1="25" x2="19" y2="19"/>
          <line x1="10" y1="59" x2="2" y2="59"/>
        </g>
      </svg>
    </div>

    <!-- title -->
    <h1 class="serif" style="margin-top:52px;font-weight:500;font-size:70px;line-height:1.02;letter-spacing:0.5px;color:#F6EFE2;">El origen<br><span style="color:#C2A05B;font-style:italic;font-weight:600;">está adentro</span></h1>

    <div style="width:64px;height:1px;background:#C2A05B;margin:40px 0;"></div>

    <p class="serif" style="font-style:italic;font-weight:400;font-size:21px;line-height:1.5;max-width:470px;color:rgba(243,236,224,0.86);">
      Las primeras claves para entender —y empezar a calmar— tu enfermedad autoinmune de la piel.
    </p>

    <div style="flex:1;"></div>

    <!-- brand block -->
    <div style="font-size:13px;letter-spacing:6px;font-weight:800;text-transform:uppercase;color:#F3ECE0;">Sánate Autoinmune</div>
    <div style="margin-top:14px;font-family:'Spectral',Georgia,serif;font-size:16px;letter-spacing:1px;color:#C2A05B;">Ezequiel Racca &nbsp;·&nbsp; Dra. Catalina Klimboski</div>
    <div style="margin-top:26px;font-size:10.5px;letter-spacing:0.4px;color:rgba(243,236,224,0.5);max-width:420px;">Material educativo. No sustituye la consulta médica ni tu tratamiento actual.</div>
