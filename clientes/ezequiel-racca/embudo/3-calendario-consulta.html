<!-- ===================================================================
     SANA TU AUTOINMUNE · Calendario de la consulta (bloque superior)
     Paso 3 del embudo. Pegar en GoHighLevel: elemento Custom Code / HTML,
     y DEBAJO de este bloque insertar el elemento de calendario de GHL.
     El bloque no pinta fondo propio: toma el de la sección de GHL, para que
     no quede una franja de otro color justo encima del calendario.
     =================================================================== -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .sta{--deep:#0E2E3E;--teal:#0E7C8B;--tealw:#E8F4F6;--mint:#2F9E7C;--mintw:#E9F5F0;
       --ground:#F5F8F9;--t0:#0D2029;--t1:#2E4650;--t2:#55707B;--br:#DCE7EB;
       font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.62}
  .sta *{box-sizing:border-box}
  .sta h1{font-family:"Instrument Sans","IBM Plex Sans",sans-serif;color:var(--t0);margin:0}
  .sta-wrap{max-width:820px;margin:0 auto;padding:0 20px}
  .sta-bar{background:var(--deep);padding:17px 0;text-align:center}
  .sta-bar b{font-family:"Instrument Sans",sans-serif;font-weight:700;letter-spacing:.09em;font-size:14px;color:#fff;display:block;text-transform:uppercase}
  .sta-bar b i{font-style:normal;color:#6FC4CF}
  .sta-bar span{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.16em;color:#9CBDC7;text-transform:uppercase}
  .sta-hero{padding:46px 0 30px;text-align:center}
  .sta-pill{display:inline-flex;align-items:center;gap:8px;font-family:"Instrument Sans",sans-serif;font-size:11px;
            font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#1D7A5C;background:var(--mintw);
            border:1px solid #CFE6DC;border-radius:6px;padding:7px 14px;margin-bottom:20px}
  .sta-pill svg{width:12px;height:12px;stroke:var(--mint);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sta-hero h1{font-size:32px;line-height:1.18;font-weight:700;letter-spacing:-.021em}
  .sta-hero>p{margin:15px auto 0;max-width:580px;font-size:16.5px;color:var(--t2)}
  .sta-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:22px}
  .sta-meta span{background:#fff;border:1px solid var(--br);border-radius:6px;padding:7px 13px;font-size:13.5px;color:var(--t1)}
  @media(max-width:640px){.sta-hero{padding:34px 0 24px}.sta-hero h1{font-size:25px}.sta-hero>p{font-size:15.5px}}
</style>
<div class="sta">
  <div class="sta-bar"><b>Sana tu <i>Autoinmune</i></b><span>Enfermedades autoinmunes · Abordaje desde la causa</span></div>
  <div class="sta-wrap">
    <div class="sta-hero">
      <span class="sta-pill"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Pago confirmado</span>
      <h1>Elige el horario de tu consulta</h1>
      <p>Selecciona el día y la hora que mejor te queden. Recibirás el enlace por correo y por WhatsApp.</p>
      <div class="sta-meta">
        <span>1 hora</span>
        <span>Uno a uno</span>
        <span>Por videollamada</span>
      </div>
    </div>
  </div>
</div>
